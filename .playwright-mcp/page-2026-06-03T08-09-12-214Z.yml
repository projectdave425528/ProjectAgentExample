        - generic [ref=e62]:
          - generic [ref=e64]:
            - paragraph [ref=e65]: The Coffee Compass is a simple tool that makes it easy to improve your filter coffee brewing. If your coffee tastes anything less than perfect, the Coffee Compass shows you exactly what direction you need to go in to achieve smooth, rich, and balanced brews.
            - paragraph [ref=e66]: We published the original Coffee Compass in 2017, and it has been used by tens of thousands of readers since then. Today, we are re-releasing the Coffee Compass as an interactive app. The app takes the guesswork out of dialing in, and makes it easier than ever before to perfect your filter coffee brewing.
            - paragraph [ref=e67]:
              - link [ref=e68] [cursor=pointer]:
                - /url: https://www.baristahustle.com/app-archive-main/the-coffee-compass/
            - heading [level=3] [ref=e69]
            - paragraph [ref=e70]
            - heading "Using the Compass" [level=3] [ref=e71]
            - paragraph [ref=e72]: "The Coffee Compass is very simple to use:"
            - list [ref=e73]:
              - listitem [level=1] [ref=e74]: Brew a coffee
              - listitem [level=1] [ref=e75]: Taste it
              - listitem [level=1] [ref=e76]: If you experience any negative flavours, find them on the compass wheel (or use the search bar)
              - listitem [level=1] [ref=e77]: The app will tell you what you need to do to travel towards the centre of the wheel
              - listitem [level=1] [ref=e78]: When you brew the next cup, let the app guide you
            - paragraph [ref=e79]: This interactive version is searchable, so it now works with even more flavour defects than can be shown on the compass. Just type in the flavour you find, and the app will automatically direct you to a similar flavour — for example, if you find your brew tastes ‘lemony’, then the app will give you the instructions for ‘sour’.
            - paragraph [ref=e80]: You can also use the stationary version of the compass below. Find your flavour on the compass map on the left, then look at the guide on the right to see what you need to do to travel back towards the center of the map.
            - generic:
              - link:
                - /url: https://www.baristahustle.com/wp-content/uploads/2021/09/The-Coffee-Compass-Base-Blog-Post-01.jpg
              - link:
                - /url: https://www.baristahustle.com/wp-content/uploads/2021/09/The-Coffee-Compass-Guide-Blog-Post-01.jpg
            - paragraph [ref=e81]:
              - strong [ref=e82]: "Extract More:"
              - generic [ref=e83]: Finer grind and/or longer brew time.
              - strong [ref=e84]: "Extract Less:"
              - generic [ref=e85]: Coarser grind and/or shorter brew time.
              - strong [ref=e86]: "Less Coffee:"
              - generic [ref=e87]:
                - text: Increase Brew Ratio — fix water weight and reduce the dose, OR fix the dose and increase
                - link "brew water" [ref=e88] [cursor=pointer]:
                  - /url: https://www.baristahustle.com/glossary/brew-water/
                - text: weight.
              - strong [ref=e89]: "More Coffee:"
              - text: Decrease Brew Ratio — fix water weight and increase the dose, OR fix the dose and decrease
              - link "brew water" [ref=e90] [cursor=pointer]:
                - /url: https://www.baristahustle.com/glossary/brew-water/
              - text: weight.
            - paragraph [ref=e91]:
              - text: The compass is designed for filter coffee brewing. It works equally well for both
              - link "percolation" [ref=e92] [cursor=pointer]:
                - /url: https://www.baristahustle.com/course/percolation/
              - text: and
              - link "immersion" [ref=e93] [cursor=pointer]:
                - /url: https://www.baristahustle.com/course/immersion/
              - text: methods. Espresso can have a similar range of flavour faults, but the methods you need to use to get towards a balanced coffee are a bit different.
            - link [ref=e98] [cursor=pointer]:
              - /url: https://vimeo.com/647485296
            - paragraph [ref=e100]:
              - text: This is mainly because increasing extraction in espresso is harder than with filter coffee. Grinding finer only increases extraction up to a point, but then
              - link "channelling kicks in and extraction begins to decline again" [ref=e101] [cursor=pointer]:
                - /url: https://www.baristahustle.com/lesson/ae-1-03-grind-size/
              - text: . On the other hand, changing the brew ratio in espresso also strongly affects extraction, as well as strength. For more on this, take a look at the
              - link "Espresso Compass" [ref=e102] [cursor=pointer]:
                - /url: https://www.baristahustle.com/blog/the-espresso-compass/
              - text: .
            - heading [level=3] [ref=e103]
            - paragraph [ref=e104]
            - heading "Brewing Faults and Coffee Taints" [level=3] [ref=e105]
            - paragraph [ref=e106]: The compass is designed to help you find the right extraction and strength for your coffee. The app assumes that you are using good-quality, well roasted coffee, and a sensible brewing method.
            - paragraph [ref=e107]: Sometimes, however, a negative flavour is intrinsic to the coffee. For example a raw, peanutty flavour can result from under-extraction, but can also be the result of under-ripe coffee, or under-roasting. If you’ve followed the advice the calculator gives you and the flavour is still there, then it’s most likely not an extraction fault but a processing or roasting one.
            - paragraph [ref=e108]: Enjoy using the new app, and let us know how you get on in the comments below!
