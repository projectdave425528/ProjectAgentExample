              - generic [ref=e1922]: Kiro is based on Code OSS, so you can [import your VS Code settings, themes, and Open VSX compatible plugins](/docs/guides/migrating-from-vscode/) in the Kiro onboarding flow.
          - generic [ref=e1923]:
            - heading "What is an AI agent?" [level=3] [ref=e1924]:
              - button "What is an AI agent?" [ref=e1925] [cursor=pointer]:
                - generic [ref=e1926]: What is an AI agent?
