            - generic [ref=e1931]:
              - heading [level=3] [ref=e1932]: What is an AI agent?
              - generic [ref=e1933]: An agent is an AI system that can plan and execute multi-step tasks with some degree of autonomy. Unlike simple chatbots that respond to individual prompts, agents can break down complex tasks, make decisions about how to proceed, and take actions to accomplish goals.
