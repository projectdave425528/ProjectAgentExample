        - generic [ref=e1867]:
          - generic [ref=e1868]:
            - heading "What is Kiro?" [level=3] [ref=e1869]:
              - button "What is Kiro?" [ref=e1870] [cursor=pointer]:
                - generic [ref=e1871]: What is Kiro?
                - img [ref=e1874]
            - generic [ref=e1876]:
              - heading [level=3] [ref=e1877]: What is Kiro?
              - generic [ref=e1878]: Kiro is an agentic AI with an [IDE](/docs/), [CLI](/docs/cli/), and [web interface](/docs/web/) that helps you go from prototype to production. From simple to complex tasks, Kiro works alongside you to turn prompts into detailed specs, then into working code, docs, and tests—so what you build is exactly what you want and ready to share with your team. Kiro’s agents help you solve challenging problems and automate tasks like generating documentation and unit tests.
          - generic [ref=e1879]:
            - heading "What is spec-driven development? How is it different from vibe coding?" [level=3] [ref=e1880]:
              - button "What is spec-driven development? How is it different from vibe coding?" [ref=e1881] [cursor=pointer]:
                - generic [ref=e1882]: What is spec-driven development? How is it different from vibe coding?
                - img [ref=e1885]
            - generic [ref=e1887]:
              - heading [level=3] [ref=e1888]: What is spec-driven development? How is it different from vibe coding?
              - generic [ref=e1889]: "Developing with specs keeps the fun of vibe coding, but fixes some of its limitations: vibe coding can require too much guidance on complex tasks or when building on top of large codebases, and it can misinterpret context. When implementing a task with vibe coding, it’s difficult to keep track of all the decisions that were made along the way, and document them for your team. By using specs, Kiro works alongside you to define requirements, system design, and tasks to be implemented before writing any code. This approach explicitly documents the reasoning and implementation decisions, so Kiro can implement more complex tasks in fewer shots."
          - generic [ref=e1890]:
            - heading "How can I get started with Kiro?" [level=3] [ref=e1891]:
              - button "How can I get started with Kiro?" [ref=e1892] [cursor=pointer]:
                - generic [ref=e1893]: How can I get started with Kiro?
                - img [ref=e1896]
            - generic [ref=e1898]:
              - heading [level=3] [ref=e1899]: How can I get started with Kiro?
              - generic [ref=e1900]: Kiro works as an agent in the [IDE](/docs/), with a [CLI](/docs/cli/), or in a [web browser](/docs/web/). [Download](/downloads/) the installer for your operating system, or [sign in](https://app.kiro.dev/agent) to use it with a paid account on the web, and log in with GitHub, Google, AWS Builder ID, or AWS IAM Identity Center. You do not need an AWS account to use Kiro. For more, see [documentation](/docs).
          - generic [ref=e1901]:
            - heading "What programming languages does Kiro support?" [level=3] [ref=e1902]:
              - button "What programming languages does Kiro support?" [ref=e1903] [cursor=pointer]:
                - generic [ref=e1904]: What programming languages does Kiro support?
                - img [ref=e1907]
            - generic [ref=e1909]:
              - heading [level=3] [ref=e1910]: What programming languages does Kiro support?
              - generic [ref=e1911]: Kiro supports a variety of programming languages that developers use in their day to day work. This list includes, but is not limited to Python, Java, JavaScript, TypeScript, C#, Go, Rust, PHP, Ruby, Kotlin, C, C++, shell scripting, SQL, Scala, JSON, YAML, and HCL.
