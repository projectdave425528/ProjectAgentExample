[project]
name = "whatsapp-accounting"
version = "0.1.0"
description = "WhatsApp 對話帳目分析系統"
requires-python = ">=3.9"
dependencies = [
    "pydantic==2.5.0",
    "openpyxl==3.1.2",
    "click==8.1.7",
    "pillow==10.1.0",
    "pytesseract==0.3.10",
    "python-dotenv==1.0.0",
    "pyyaml==6.0.1",
    "openai==1.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
